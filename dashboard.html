<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Financeiro</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="topbar">

        <div>

            <h1>💰 Meu Financeiro</h1>

            <p id="nomeUsuario"></p>

        </div>

        <button id="btnSair">
            Sair
        </button>

    </header>


    <main class="dashboard">

        <section class="resumo">

            <div class="card resumo-card">

                <span>Receitas</span>

                <strong id="totalReceitas">
                    R$ 0,00
                </strong>

            </div>


            <div class="card resumo-card">

                <span>Despesas</span>

                <strong id="totalDespesas">
                    R$ 0,00
                </strong>

            </div>


            <div class="card resumo-card">

                <span>Saldo</span>

                <strong id="saldo">
                    R$ 0,00
                </strong>

            </div>

        </section>


        <section class="card formulario-card">

            <h2>Adicionar lançamento</h2>

            <form id="financeForm">

                <label for="tipo">
                    Tipo
                </label>

                <select id="tipo" required>

                    <option value="despesa">
                        Despesa
                    </option>

                    <option value="receita">
                        Receita
                    </option>

                </select>


                <label for="descricao">
                    Descrição
                </label>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Ex: Supermercado"
                    required
                >


                <label for="valor">
                    Valor total
                </label>

                <input
                    type="number"
                    id="valor"
                    placeholder="0,00"
                    step="0.01"
                    min="0"
                    required
                >


                <label for="categoria">
                    Categoria
                </label>

                <select id="categoria" required>

                    <option value="Alimentação">
                        🍔 Alimentação
                    </option>

                    <option value="Transporte">
                        🚗 Transporte
                    </option>

                    <option value="Casa">
                        🏠 Casa
                    </option>

                    <option value="Lazer">
                        🎮 Lazer
                    </option>

                    <option value="Estudos">
                        🎓 Estudos
                    </option>

                    <option value="Compras">
                        🛒 Compras
                    </option>

                    <option value="Saúde">
                        ❤️ Saúde
                    </option>

                    <option value="Outros">
                        📦 Outros
                    </option>

                </select>


                <label for="pagamento">
                    Forma de pagamento
                </label>

                <select id="pagamento">

                    <option value="Pix">
                        Pix
                    </option>

                    <option value="Débito">
                        Débito
                    </option>

                    <option value="Dinheiro">
                        Dinheiro
                    </option>

                    <option value="Crédito">
                        Cartão de crédito
                    </option>

                </select>


                <label for="tipoCompra">
                    Tipo de compra
                </label>

                <select id="tipoCompra">

                    <option value="avista">
                        À vista
                    </option>

                    <option value="parcelado">
                        Parcelado
                    </option>

                </select>


                <div id="parcelamentoArea" class="hidden">

                    <label for="parcelas">
                        Número de parcelas
                    </label>

                    <input
                        type="number"
                        id="parcelas"
                        min="2"
                        value="2"
                    >

                </div>


                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    required
                >


                <button type="submit">
                    Adicionar lançamento
                </button>

            </form>

        </section>


        <section class="card">

            <div class="historico-header">

                <h2>
                    Meus lançamentos
                </h2>

                <button
                    id="limparLancamentos"
                    class="btn-danger"
                >
                    Limpar meus lançamentos
                </button>

            </div>


            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>

                            <th>Data</th>

                            <th>Descrição</th>

                            <th>Categoria</th>

                            <th>Pagamento</th>

                            <th>Parcelas</th>

                            <th>Valor</th>

                            <th>Ação</th>

                        </tr>

                    </thead>

                    <tbody id="listaLancamentos"></tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="./dashboard.js"></script>

</body>

</html>
