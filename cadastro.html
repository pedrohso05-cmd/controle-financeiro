<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar conta</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <h1>💰 Criar minha conta</h1>

            <p class="subtitle">
                Crie sua conta no Controle Financeiro
            </p>

            <form id="cadastroForm">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Mínimo de 6 caracteres"
                    required
                >

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    required
                >

                <button type="submit">
                    Criar minha conta
                </button>

            </form>

            <p id="mensagem"></p>

            <p style="text-align: center; margin-top: 20px;">

                Já tenho uma conta.

                <a href="index.html">
                    Fazer login
                </a>

            </p>

        </div>

    </div>

    <script
        type="module"
        src="./cadastro.js">
    </script>

</body>

</html>
